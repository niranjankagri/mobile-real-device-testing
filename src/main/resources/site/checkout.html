<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Without this line a phone renders the page 980 px wide and shrinks it: the classic broken mobile site -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | PocketShop</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">PocketShop</a>
    <a class="cart-link" id="cart-link" href="cart.html" aria-label="Cart">Cart<span class="cart-count" id="cart-count">0</span></a>
    <button class="icon-button menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Products</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="checkout.html">Checkout</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <h1>Checkout</h1>
    <form id="checkout-form" novalidate>
      <!-- type, inputmode and autocomplete choose the phone keyboard and let the browser fill the field -->
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" autocomplete="name" aria-describedby="name-error">
        <p class="error" id="name-error"></p>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autocapitalize="off" aria-describedby="email-error">
        <p class="error" id="email-error"></p>
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-error">
        <p class="error" id="phone-error"></p>
      </div>
      <div class="field">
        <label for="postcode">Postcode</label>
        <input id="postcode" name="postcode" type="text" inputmode="numeric" autocomplete="postal-code" aria-describedby="postcode-error">
        <p class="error" id="postcode-error"></p>
      </div>
      <div class="action-bar">
        <button class="button" id="place-order" type="submit">Place order</button>
      </div>
    </form>
  </main>
</body>
</html>
