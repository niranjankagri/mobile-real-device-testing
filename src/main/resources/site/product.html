<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Without this line a phone renders the page 980 px wide and shrinks it: the classic broken mobile site -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product | PocketShop</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">PocketShop</a>
    <a class="cart-link" id="cart-link" href="cart.html" aria-label="Cart">Cart<span class="cart-count" id="cart-count">0</span></a>
    <button class="icon-button menu-button" id="menu-button" type="button" aria-expanded="false" aria-controls="main-nav">Menu</button>
    <nav class="main-nav" id="main-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Products</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="checkout.html">Checkout</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <article id="product">
      <!-- Filled in by app.js from ?id= in the address -->
      <img id="product-image" src="mug.svg" alt="" width="240" height="240">
      <h1 id="product-name">Product</h1>
      <p class="price" id="product-price"></p>
      <!-- Quantity: two 44 px buttons; aria-live reads the new value out after a tap -->
      <div class="stepper" role="group" aria-label="Quantity">
        <button class="icon-button" id="less" type="button" aria-label="One less">−</button>
        <output id="quantity" aria-live="polite">1</output>
        <button class="icon-button" id="more" type="button" aria-label="One more">+</button>
      </div>
      <p id="added" role="status"></p>
      <div class="action-bar">
        <button class="button" id="add-to-cart" type="button">Add to cart</button>
      </div>
    </article>
  </main>
</body>
</html>
